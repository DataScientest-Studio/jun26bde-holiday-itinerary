services:
  postgres:
    image: postgres:16
    container_name: holiday_itinerary_repo
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql


  neo4j:
    image: neo4j:5
    container_name: holiday_itinerary_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data

    
  api:
    build: .
    container_name: holiday_itinerary_api
    restart: unless-stopped

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}

    ports:
      - "8000:8000"

    depends_on:
      - postgres
      - neo4j

    command:
      uvicorn src.api.main:app --host 0.0.0.0 --port 8000


  streamlit:
    build: .
    container_name: holiday_itinerary_streamlit
    restart: unless-stopped

    environment:
      API_URL: http://api:8000

    ports:
      - "8501:8501"

    depends_on:
      - api

    command:
      streamlit run src/streamlit/app.py
      --server.address 0.0.0.0
      --server.port 8501

  airflow-db:
    image: postgres:16
    container_name: holiday_itinerary_airflow_db

    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow

    volumes:
      - airflowdb:/var/lib/postgresql/data

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow

    container_name: holiday_itinerary_airflow_init

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
      AIRFLOW__API_AUTH__JWT_SECRET: "holiday-itinerary-super-secret"
      AIRFLOW__API__SECRET_KEY: "holiday-itinerary-api-secret"

    depends_on:
      - airflow-db

    command: db migrate

    restart: "no"
  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow

    container_name: holiday_itinerary_airflow_webserver

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
      AIRFLOW__CORE__HOSTNAME_CALLABLE: socket.gethostname
      AIRFLOW__API_AUTH__JWT_SECRET: "holiday-itinerary-super-secret"
      AIRFLOW__API__SECRET_KEY: "holiday-itinerary-api-secret"

    volumes:
      - ./src/dags:/opt/airflow/dags
      - ./:/opt/airflow/project

    ports:
      - "8080:8080"

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    command:
      api-server
  
  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow

    container_name: holiday_itinerary_airflow_scheduler

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
      AIRFLOW__CORE__HOSTNAME_CALLABLE: socket.gethostname
      AIRFLOW__API_AUTH__JWT_SECRET: "holiday-itinerary-super-secret"
      AIRFLOW__API__SECRET_KEY: "holiday-itinerary-api-secret"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-webserver:8080/execution/"

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}

      DATATOURISME_API_KEY: ${DATATOURISME_API_KEY}

    volumes:
      - ./src/dags:/opt/airflow/dags
      - ./:/opt/airflow/project

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    command:
      scheduler

  airflow-dag-processor:
    build:
      context: .
      dockerfile: Dockerfile.airflow

    container_name: holiday_itinerary_airflow_dag_processor

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
      AIRFLOW__CORE__HOSTNAME_CALLABLE: socket.gethostname
      AIRFLOW__API_AUTH__JWT_SECRET: "holiday-itinerary-super-secret"
      AIRFLOW__API__SECRET_KEY: "holiday-itinerary-api-secret"

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}

      DATATOURISME_API_KEY: ${DATATOURISME_API_KEY}

    volumes:
      - ./src/dags:/opt/airflow/dags
      - ./:/opt/airflow/project

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    command:
      dag-processor

volumes:
  pgdata:
  neo4jdata:
  airflowdb: